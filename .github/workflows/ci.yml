name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and build smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build
        shell: pwsh
        run: .\build_exe.ps1

      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: PrusaToOrca-${{ github.sha }}
          path: release/
          retention-days: 14
